    <script>
        document.addEventListener('DOMContentLoaded', () => {
           
            function setupDropdown(menuSelector, droopSelector) {
                const menu = document.querySelector(menuSelector);
                const droop = menu.querySelector(droopSelector);
                const link = menu.querySelector('.opcoes'); // O link que será clicável
   
                link.addEventListener('click', (event) => {
                    event.preventDefault(); // Impede o link de navegar
                   
                    // Fecha todos os outros dropdowns
                    document.querySelectorAll('.droop.show').forEach(otherDroop => {
                        if (otherDroop !== droop) {
                            otherDroop.classList.remove('show');
                        }
                    });
   
                    // Alterna a classe 'show' no dropdown clicado
                    droop.classList.toggle('show');
                });
   
                // Fecha o dropdown se o usuário clicar fora dele
                document.addEventListener('click', (event) => {
                    if (!menu.contains(event.target) && droop.classList.contains('show')) {
                        droop.classList.remove('show');
                    }
                });
            }
   
            // Aplica a funcionalidade para Lendas
            setupDropdown('.menu-das-lendas', '.droop');
           
            // Aplica a funcionalidade para Curtas
            setupDropdown('.menu-curtas', '.droop');
        });
    </script>

<script>
    // Seleciona os elementos do DOM
    const audioPlayer = document.getElementById('meuAudio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressBar = document.getElementById('progressBar');
    
    // Event Listener para o botão Play/Pause
    playPauseBtn.addEventListener('click', () => {
        if (audioPlayer.paused) {
            audioPlayer.play();
            playPauseBtn.classList.add('is-playing'); // Adiciona a classe CSS para mudar o ícone
        } else {
            audioPlayer.pause();
            playPauseBtn.classList.remove('is-playing'); // Remove a classe CSS para mudar o ícone
        }
    });
    
    // Event Listener para atualizar a barra de progresso em tempo real
    audioPlayer.addEventListener('timeupdate', () => {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressBar.style.width = progress + '%';
    });
</script>

<script>
    function FiltrarCidade(cidade) {
    const cards = document.querySelectorAll('.card-lenda');

    cards.forEach(card => {
        if (cidade === 'Todos') {
            card.classList.add('apresentar');
        } else {
            if (card.dataset.cidade === cidade) {
                card.classList.add('apresentar');
            } else {
                card.classList.remove('apresentar');
            }
        }
    });
}

FiltrarCidade('Todos');
</script>
